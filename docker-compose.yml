name: oncobridge

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: oncobridge
      POSTGRES_USER: oncobridge
      POSTGRES_PASSWORD: oncobridge
    volumes:
      - oncobridge-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oncobridge -d oncobridge']
      interval: 2s
      timeout: 3s
      retries: 40

  migrate:
    build:
      context: .
      dockerfile: docker/migrations.Dockerfile
    environment:
      ConnectionStrings__OncoBridge: Host=postgres;Port=5432;Database=oncobridge;Username=oncobridge;Password=oncobridge
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__OncoBridge: Host=postgres;Port=5432;Database=oncobridge;Username=oncobridge;Password=oncobridge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_started

volumes:
  oncobridge-data:
